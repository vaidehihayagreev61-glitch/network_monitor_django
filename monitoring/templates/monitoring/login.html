{% extends "monitoring/base.html" %}
{% block title %}Login | Network Monitor{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-5 col-lg-4">
    <div class="card sidebar-card p-4">
      <h3 class="mb-1">Administrator login</h3>
      <p class="text-secondary">Sign in to manage monitored devices.</p>
      {% if form.errors %}<div class="alert alert-danger">Username or password is incorrect.</div>{% endif %}
      <form method="post">
        {% csrf_token %}
        <div class="mb-3"><label class="form-label" for="id_username">Username</label><input class="form-control" id="id_username" name="username" required autofocus></div>
        <div class="mb-3"><label class="form-label" for="id_password">Password</label><input class="form-control" id="id_password" name="password" type="password" required></div>
        <input type="hidden" name="next" value="{{ next }}">
        <button class="btn btn-primary w-100" type="submit">Login</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
